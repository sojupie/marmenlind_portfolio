<!doctype html>
<html lang="{{ site.Language.Locale }}">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} | {{ site.Title }}{{
    end }}</title>
  <meta name="description" content="{{ .Description | default site.Params.description }}">
  <meta name="author" content="{{ site.Params.author }}">
  <meta name="theme-color" content="#f5f5f5">
  <link rel="canonical" href="{{ .Permalink }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Noto+Serif:ital,wght@0,100..900;1,100..900&family=Spline+Sans+Mono:ital,wght@0,300..700;1,300..700&display=swap"
    rel="stylesheet">
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined&icon_names=arrow_back%2Carrow_forward%2Cchevron_right%2Copen_in_new%2Cplay_arrow&display=block"
    rel="stylesheet">
  {{ partial "css.html" . }}
  <link rel="icon" href="/assets/img/marmeno-logo.png">
</head>

<body
  class="relative flex min-h-screen flex-col bg-white font-serif text-base leading-relaxed text-black antialiased before:pointer-events-none before:absolute before:inset-0 before:z-50 before:bg-paper before:bg-repeat before:opacity-15 before:mix-blend-multiply print:before:hidden">
  <a class="fixed left-3 top-3 z-50 -translate-y-24 bg-black px-3 py-2 font-sans text-xs text-white focus:translate-y-0 focus:outline-2 focus:outline-offset-2 focus:outline-black"
    href="#main">Skip to content</a>
  {{ partial "header.html" . }}
  {{ if not .IsHome }}{{ partial "breadcrumbs.html" . }}{{ end }}
  <main class="flex-1" id="main">{{ block "main" . }}{{ end }}</main>
  {{ partial "footer.html" . }}
</body>

</html>
