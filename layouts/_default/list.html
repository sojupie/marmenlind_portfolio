{{ define "main" }}
<div class="mx-auto w-full max-w-6xl px-5 py-12 md:px-8 md:py-16 lg:pb-28 xl:px-12">
  <header class="mb-16 grid md:grid-cols-4 md:gap-x-8">
    <h1 class="mb-4 font-sans text-4xl font-semibold leading-tight tracking-tight md:col-span-3 md:col-start-2 md:text-5xl">{{ .Title }}</h1>
    <div class="max-w-2xl md:col-span-3 md:col-start-2">{{ .Content }}</div>
  </header>
  <div class="divide-y divide-neutral-300 md:ml-48">
    {{ range .Pages.ByDate.Reverse }}
    <article class="grid grid-cols-4 gap-4 py-5 md:grid-cols-12 md:gap-6">
      <p class="font-mono text-xs uppercase md:col-span-2">{{ with .Date }}{{ .Format "2006-01" }}{{ end }}</p>
      <div class="col-span-3 md:col-span-4"><h2 class="font-sans font-semibold leading-snug"><a class="inline-flex items-baseline gap-1 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-black" href="{{ .Params.external_url | default .RelPermalink }}" {{ with .Params.external_url }}target="_blank" rel="noopener noreferrer"{{ end }}><span class="underline decoration-1 decoration-neutral-400 underline-offset-4 hover:decoration-black">{{ .Title }}</span>{{ with .Params.external_url }}<span class="material-symbols-outlined self-center text-base! leading-none" aria-hidden="true">open_in_new</span><span class="sr-only"> (opens in new tab)</span>{{ end }}</a></h2></div>
      <p class="col-span-3 col-start-2 md:col-span-6 md:col-start-auto">{{ .Params.summary | default .Description }}</p>
    </article>
    {{ end }}
  </div>
</div>
{{ end }}
