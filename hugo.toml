baseURL = 'https://marmenlind.com/'
locale = 'en-us'
title = 'Olle Marmenlind'
enableRobotsTXT = true

[params]
  author = 'Olle Marmenlind'
  description = 'Final-year KTH Computer Engineering student with experience in embedded and full-stack engineering and technical product ownership.'
  email = 'olle@marmenlind.com'
  github = 'https://github.com/sojupie'
  cv = '/assets/docs/CV_OLLE_MARMENLIND_RESUME.pdf'

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[caches]
  [caches.images]
    dir = ':cacheDir/images'

[security]
  allowContent = ['^text/html$', '^text/markdown$']

# Make static files available to Hugo Pipes while preserving their original URLs.
[module]
  [[module.mounts]]
    source = 'assets'
    target = 'assets'
  [[module.mounts]]
    source = 'static'
    target = 'static'
  [[module.mounts]]
    source = 'static'
    target = 'assets/public-assets'
